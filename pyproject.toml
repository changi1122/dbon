[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbon"
version = "0.1.0"
description = "Spin up dev DBMS containers (oracle, postgres, mysql, mariadb, mssql, cubrid, sybase, db2, altibase, firebird, sybaseiq, hana) with docker compose"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dbon = "dbon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
